name = "pokeidle-farm-alerts"
main = "src/index.js"
compatibility_date = "2026-10-01"

# IDs públicos (não são segredo). GUILD_ID: servidor. O canal das threads é achado pelo nome
# (CHANNEL_NAME); se preferir fixar, coloque o ID em CHANNEL_ID.
[vars]
CLIENT_ID = "1570904100856537108"
GUILD_ID = "710623557343772703"
CHANNEL_NAME = "pokeidle"
CHANNEL_ID = ""

# Mapa "id do usuário -> id da thread". O workflow deploy-worker.yml cria e preenche o id sozinho.
[[kv_namespaces]]
binding = "THREADS"
id = "ac48c8344b684078977dbe7004b7536e"

# Segredos (nunca no repositório), definidos com `npx wrangler secret put <NOME>`:
#   CLIENT_SECRET  - OAuth2 > Client Secret
#   BOT_TOKEN      - Bot > Token
#   SESSION_KEY    - opcional; sem ele a chave dos crachás é derivada dos dois acima
