name: Deploy servidor de alertas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/alerts-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir segredos
        env:
          CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLIENT_SECRET BOT_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Falta o secret do GitHub para $v"; exit 1; fi
          done

      - name: Descobrir Account ID (se o secret não existir)
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id')
            [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "::error::Não achei a conta do Cloudflare com esse token"; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          fi

      - name: Instalar wrangler
        run: npm install --no-save wrangler@4

      - name: Criar ou achar o KV THREADS
        run: |
          set -euo pipefail
          TITLE="pokeidle-farm-alerts-THREADS"
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"title\":\"$TITLE\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result.id')
            echo "KV criado"
          fi
          sed -i -E "s/^id = \"[^\"]*\"/id = \"$ID\"/" wrangler.toml
          grep -q "id = \"$ID\"" wrangler.toml

      - name: Garantir subdomínio workers.dev
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -n "$CUR" ]; then echo "subdomínio: $CUR"; exit 0; fi
          for NAME in pokeidle-farm pokeidle-farm-alerts "pokeidle-farm-$(date +%s | tail -c 5)"; do
            R=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$NAME\"}" "$API")
            if [ "$(echo "$R" | jq -r '.success')" = "true" ]; then echo "subdomínio criado: $NAME"; exit 0; fi
            echo "$R" | jq -c '.errors'
          done
          echo "::error::Não consegui registrar o subdomínio workers.dev"; exit 1

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Gravar segredos no Cloudflare
        env:
          CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$CLIENT_SECRET" | npx wrangler secret put CLIENT_SECRET
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN

      - name: Registrar /resumo e o endpoint de interações no Discord
        id: discord
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          APP=$(grep -E '^CLIENT_ID' wrangler.toml | grep -oE '[0-9]{17,20}')
          GUILD=$(grep -E '^GUILD_ID' wrangler.toml | grep -oE '[0-9]{17,20}')
          sleep 10
          CMDS='[{"name":"resumo","description":"Resumo das suas capturas no PokeIdle Farm","dm_permission":false,"options":[{"type":4,"name":"horas","description":"Quantas horas pra trás (padrão 6, máximo 48)","min_value":1,"max_value":48,"required":false}]}]'
          curl -fsS -X PUT -H "Authorization: Bot $BOT_TOKEN" -H "Content-Type: application/json" --data "$CMDS" \
            "https://discord.com/api/v10/applications/$APP/guilds/$GUILD/commands" | jq -c '[.[] | .name]'
          for i in 1 2 3; do
            R=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X PATCH -H "Authorization: Bot $BOT_TOKEN" -H "Content-Type: application/json" \
              --data "{\"interactions_endpoint_url\":\"$URL/interactions\"}" "https://discord.com/api/v10/applications/@me")
            if [ "$R" = "200" ]; then echo "endpoint ok"; exit 0; fi
            echo "tentativa $i: $R $(cat /tmp/r.json)"; sleep 15
          done
          exit 1

      - name: Resumo
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl -fsS "$URL/" || true
          {
            echo "### Servidor de alertas no ar"
            echo ""
            echo "URL: \`$URL\`"
            echo ""
            echo "Redirect para o Discord (OAuth2 › Redirects): \`$URL/callback\`"
            echo ""
            if [ "${{ steps.discord.outcome }}" = "success" ]; then
              echo "Comando /resumo registrado e Interactions Endpoint URL configurada."
            else
              echo "Não consegui configurar o /resumo sozinho. No Developer Portal › General Information, cole em Interactions Endpoint URL: \`$URL/interactions\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
