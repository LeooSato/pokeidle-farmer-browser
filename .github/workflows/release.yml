# Gera o instalador e a versão portátil no Windows, assina (quando o SignPath estiver
# configurado) e publica no GitHub Releases.
# Como usar: suba a versão no package.json, faça push na main e rode o workflow
# (Actions → Release → Run workflow) ou crie a tag (git tag v1.0.1 && git push --tags).
#
# Assinatura (SignPath Foundation): depois que o projeto for aprovado, crie em
# Settings → Secrets and variables → Actions:
#   secret   SIGNPATH_API_TOKEN        (token do usuário CI no SignPath)
#   variable SIGNPATH_ORGANIZATION_ID  (id da organização no SignPath)
# Sem eles o build sai sem assinatura, como antes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Só gera os arquivos; quem publica é o último passo.
      - run: npm run dist

      - name: Enviar executáveis pra assinatura
        if: env.SIGN == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            dist/PokeIdle-Farm-Setup-*.exe
            dist/PokeIdle-Farm-Portatil-*.exe
            !dist/*uninstaller*

      - name: Assinar com SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pokeidle-farmer-browser
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Trocar pelos assinados e refazer latest.yml
        if: env.SIGN == 'true'
        shell: bash
        run: |
          ls -l dist/signed
          cp -f dist/signed/*.exe dist/
          node scripts/refresh-update-info.js

      - name: Publicar no Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          FILES=(dist/PokeIdle-Farm-Setup-$V.exe dist/PokeIdle-Farm-Setup-$V.exe.blockmap dist/PokeIdle-Farm-Portatil-$V.exe dist/latest.yml)
          ls -l "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "$V" --target "$GITHUB_SHA" --generate-notes
          fi
